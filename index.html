<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LENGUAJE-PRO V27.0 HD -20% FOTO 3</title>
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#00d4ff">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
.h-wrapper{margin-top:58px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;height:calc(100vh - 58px);position:relative;z-index:10}
.h-wrapper::-webkit-scrollbar{display:none}
.page{min-width:100vw;width:100vw;height:100%;scroll-snap-align:start;overflow-y:auto;display:flex;flex-direction:row;position:relative;z-index:10}
#page1 aside{width:330px;min-width:330px;background:rgba(26,26,35,0.18)!important;backdrop-filter:blur(2px);border:1px solid rgba(0,212,255,0.15);padding:14px;position:sticky;top:0;height:calc(100vh - 58px);overflow-y:auto;z-index:11;pointer-events:auto}
#page1 main{flex:1;padding:18px;max-width:860px;background:rgba(15,15,20,0.10)!important;z-index:11;pointer-events:auto}
#page2{background:rgba(18,18,26,0.10);padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;min-width:100vw;z-index:11;pointer-events:auto}
.sap-header,.sap-card,.evo-lab,#card{background:rgba(26,26,35,0.26)!important;backdrop-filter:blur(4px)!important;border:1px solid rgba(0,212,255,0.25)!important;z-index:12!important}
button, input, select, .area, .f, .word{pointer-events:auto!important;z-index:15!important}
.area{background:rgba(35,35,50,0.40)!important;border:1px solid rgba(0,212,255,0.15)!important}
#laia-hologram{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;z-index:5!important;display:flex!important;align-items:center!important;justify-content:center!important;pointer-events:none!important;opacity:1!important}
#laia-holo-canvas{width:100vw!important;height:100vh!important;background:transparent!important;pointer-events:none!important}
#laia-state{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,0.9);color:#000;font-size:9px;padding:3px 10px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<header style="z-index:100"><div class="logo">📚 LENGUAJE-PRO <span>V27.0 HD -20% 0.11 WAIST</span></div><div class="metrics"><span id="xp">⭐ 0 XP</span><span>🔥 <b id="streak">0</b></span><span id="level-badge">A2</span></div></header>
<div class="h-wrapper" id="hWrapper"><div class="page" id="page1"><aside><h3 style="font-size:11px;color:#00d4ff">V27.0 HD -20% - FOTO 3 NITIDA</h3><input id="search" placeholder="Buscar..."><div id="filters"><button class="f active" data-f="">Todas</button><button class="f" data-f="A1">A1</button><button class="f" data-f="A2">A2</button><button class="f" data-f="B1">B1</button><button class="f" data-f="B2">B2</button></div><div id="list"></div></aside><main><div style="display:flex;gap:10px;margin-bottom:12px"><select id="level"><option>A1</option><option selected>A2</option><option>B1</option><option>B2</option></select><button id="gen" style="background:#00d4ff;color:#000;border:none;padding:10px 16px;border-radius:10px;font-weight:700;flex:1;max-width:260px">⚡ GENERAR V27.0</button><button id="teachBtn" style="background:#8b5cf6;color:#fff;border:none;padding:10px 12px;border-radius:10px;font-weight:700">📌 SAPs</button></div><div id="empty"><h1>👋 Soy Laia V27.0 HD -20%</h1><p id="status" style="color:#00d4ff">Malla HD foto 3 -20% cabe completa...</p></div><div id="card" class="hidden"></div></main></div><div class="page" id="page2"><div style="width:100%;max-width:760px"><h2>🧬 MOTOR 2 - SAP + CONSTELLATION</h2><div class="sap-header" id="sapHeader">Esperando datos...</div><div style="margin-top:14px;display:flex;gap:8px"><input id="wordInput" placeholder="Escribe: co, hav, mon..." style="flex:1;background:#1a1a23;border:1px solid #2a2a3a;color:#fff;padding:10px;border-radius:10px"><button id="gen2" style="background:#00d4ff;color:#000;border:none;padding:10px 16px;border-radius:10px;font-weight:700">🔍 EXPLORAR</button></div><div id="card2" class="hidden" style="margin-top:14px;background:#1a1a23;border-radius:16px;padding:18px"></div><div class="evo-lab" id="evoLab">V27.0 HD -20% FOTO 3 - 0.11 WAIST - ALTA DEFINICION - CABE ENTERA</div></div></div></div>
<div id="laia-hologram"><canvas id="laia-holo-canvas"></canvas><div id="laia-state">V27.0 HD -20% - FOTO 3 COMPLETA</div></div>
<script type="module">
import { LAYA_FINAL } from './LAYA_FINAL_COMPLETO.js';
import { thinkAndMove } from './actor/laia_actor_brain.js';
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

class LaiaMeshOnly {
  constructor(canvas){
    this.canvas=canvas; this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 100);
    this.camera.position.set(0, 0.15, 1.95);
    this.renderer=new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2.0));
    this.bones=[]; this.group=new THREE.Group();
    this.group.scale.set(0.57, 0.57, 0.57);
    this.group.position.set(0.0, -0.08, 0);
    if(window.innerWidth<768){ this.camera.position.set(0, 0.10, 2.35); this.group.scale.set(0.544,0.544,0.544); this.group.position.set(0.0, -0.05, 0); }
    this.createInvisibleSkeleton(); this.createFullBodyPointCloudREAL();
    this.scene.add(this.group); this.clock=new THREE.Clock();
    window.addEventListener('resize',()=>{this.camera.aspect=window.innerWidth/window.innerHeight; this.camera.updateProjectionMatrix(); this.renderer.setSize(window.innerWidth, window.innerHeight);});
    this.animate();
  }
  createInvisibleSkeleton(){const mk=(p,par)=>{const b=new THREE.Bone(); b.position.copy(p); par.add(b); this.bones.push(b); return b;}; const hips=mk(new THREE.Vector3(0,0,0),this.group); const s1=mk(new THREE.Vector3(0,0.18,0),hips); const s2=mk(new THREE.Vector3(0,0.22,0),s1); const ch=mk(new THREE.Vector3(0,0.22,0),s2); mk(new THREE.Vector3(0,0.18,0),ch); mk(new THREE.Vector3(0,0.14,0),ch); while(this.bones.length<34) mk(new THREE.Vector3(0,0,0),hips);}

  createFullBodyPointCloudREAL(){
    // V27 HD -20% - FOTO 3 NITIDA - MISMA MALLA DIRECTA V26 PERO ESCALA -20% Y MATERIAL HD
    const geos = [];
    const torso = new THREE.CylinderGeometry(0.18, 0.165, 0.54, 16, 14, false);
    const tp = torso.attributes.position;
    for(let i=0;i<tp.count;i++){
      const y=tp.getY(i); const x=tp.getX(i); const z=tp.getZ(i);
      const ang=Math.atan2(z,x);
      let sc=1;
      if(y>0.19) sc=1.12;
      else if(y>0.02) sc=0.62;
      else if(y>-0.15) sc=0.97;
      else sc=0.92;
      tp.setX(i, Math.cos(ang)*0.18*sc);
      tp.setZ(i, Math.sin(ang)*0.12*sc);
    }
    torso.translate(0,0.22,0);
    geos.push(torso);

    const makeLeg = (side)=>{
      const leg = new THREE.CylinderGeometry(0.088, 0.048, 0.78, 12, 14, false);
      const p=leg.attributes.position;
      for(let j=0;j<p.count;j++){
        const y=p.getY(j);
        let r=1;
        if(y>0.25) r=1.0;
        else if(y>0.05) r=0.88;
        else if(y>-0.25) r=0.76;
        else r=0.60;
        p.setX(p.getX(j)*r); p.setZ(p.getZ(j)*r);
      }
      leg.translate(side*0.11, -0.24, 0);
      return leg;
    };
    geos.push(makeLeg(-1), makeLeg(1));

    const foot = new THREE.SphereGeometry(0.06, 10, 8); foot.scale(1,0.55,1.8);
    const fL=foot.clone(); fL.translate(-0.11,-0.68,0.04);
    const fR=foot.clone(); fR.translate(0.11,-0.68,0.04);
    geos.push(fL,fR);

    const makeArm = (side)=>{
      const arm = new THREE.CylinderGeometry(0.044, 0.031, 0.70, 10, 10, false);
      arm.rotateZ(Math.PI/2);
      arm.translate(side*0.53, 0.36, 0);
      return arm;
    };
    geos.push(makeArm(-1), makeArm(1));

    const hand = new THREE.SphereGeometry(0.034, 8, 6); hand.scale(1,0.6,1.15);
    const hl=hand.clone(); hl.translate(-0.90,0.36,0);
    const hr=hand.clone(); hr.translate(0.90,0.36,0);
    geos.push(hl,hr);

    const head = new THREE.SphereGeometry(0.11, 16, 16); head.translate(0,0.68,0.02);
    const eye = new THREE.SphereGeometry(0.012, 6, 6);
    const el=eye.clone(); el.translate(-0.032,0.70,0.08);
    const er=eye.clone(); er.translate(0.032,0.70,0.08);
    const mouth=new THREE.SphereGeometry(0.009,6,6); mouth.translate(0,0.65,0.085);
    geos.push(head,el,er,mouth);

    const fullMesh = mergeGeometries(geos);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', fullMesh.attributes.position.clone());
    const wireframe = new THREE.WireframeGeometry(fullMesh);

    // HD MATERIAL - mas fino = alta definicion foto 3
    this.bones[3].add(new THREE.Points(geo, new THREE.PointsMaterial({color:0x00d4ff, size:0.009, transparent:true, opacity:0.88, sizeAttenuation:true})));
    this.bones[3].add(new THREE.LineSegments(wireframe, new THREE.LineBasicMaterial({color:0x00d4ff, transparent:true, opacity:0.22})));

    const bob = new THREE.SphereGeometry(0.115, 10, 10, 0, Math.PI*2, 0, Math.PI*0.62);
    bob.translate(0,0.68,-0.01);
    const hg=new THREE.BufferGeometry(); hg.setAttribute('position', bob.attributes.position.clone());
    this.bones[3].add(new THREE.Points(hg, new THREE.PointsMaterial({color:0xc9a88a, size:0.008, transparent:true, opacity:0.78})));
  }
  async goTo(z){
    const m={
      welcome:{x:0.0,y:-0.08},
      reading_text:{x:-0.08,y:-0.06},
      input_field:{x:0.08,y:-0.06},
      feedback_ok:{x:0.0,y:-0.10},
      feedback_err:{x:0.0,y:-0.04}
    }; 
    if(m[z]){this.group.position.x=m[z].x; this.group.position.y=m[z].y;} 
    document.getElementById('laia-state').textContent=z.toUpperCase()+' • V27.0 HD -20%';
  }
  animate(){requestAnimationFrame(()=>this.animate()); const t=this.clock.getElapsedTime(); thinkAndMove(this.bones, {reading:true, talkAmp:0.3+Math.sin(t*4)*0.2}); this.renderer.render(this.scene, this.camera);}
}
let metrics=JSON.parse(localStorage.getItem('LAYA_METRICS_V9')||'{"level":"A2","xp_total":50,"streak_days":8}');
let selected=null, currentFilter='';
const laiaActor=new LaiaMeshOnly(document.getElementById('laia-holo-canvas'));
const listEl=document.getElementById('list');
function renderList(f='', lvl=''){ if(!LAYA_FINAL||!LAYA_FINAL.AREAS){listEl.innerHTML='Error'; return;} listEl.innerHTML=''; let first=null; Object.entries(LAYA_FINAL.AREAS).forEach(([id,a])=>{ const hay=`${id} ${a.name} ${a.topic} ${a.level}`.toLowerCase(); if(f&&!hay.includes(f)) return; if(lvl&&a.level!==lvl) return; if(!first) first=id; const d=document.createElement('div'); d.className='area'; d.innerHTML=`<b>${id}. ${a.name}</b><small>${a.topic} • ${a.level}</small>`; d.onclick=()=>{selected=id; document.querySelectorAll('.area').forEach(x=>x.classList.remove('active')); d.classList.add('active'); laiaActor.goTo('reading_text');}; listEl.appendChild(d); }); if(!selected&&first) selected=first; document.getElementById('status').textContent=`V27.0 HD -20%: ${Object.keys(LAYA_FINAL.AREAS).length} áreas`; }
renderList();
document.getElementById('search').oninput=e=>renderList(e.target.value.toLowerCase(), currentFilter);
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentFilter=b.dataset.f; renderList(document.getElementById('search').value.toLowerCase(), currentFilter);});
document.getElementById('level').value=metrics.level; document.getElementById('streak').textContent=metrics.streak_days; document.getElementById('xp').textContent=`⭐ ${metrics.xp_total} XP`; document.getElementById('level-badge').textContent=metrics.level;
function pushToPage2(res, w){ document.getElementById('sapHeader').innerHTML=`<b style="color:#00d4ff">V27.0 HD -20% // ${res.meta.grammar_main.sig} // ${w}</b><div style="margin-top:8px;font-size:12px">📍 ${res.meta.area} | ${res.meta.topic}</div>`; }
function renderLesson(res){ const card=document.getElementById('card'); const words=res.story.split(/(\s+)/).map(w=>{ const clean=w.toLowerCase().replace(/[^a-z]/g,''); if(!clean||w.trim().length<2) return w; return `<span class="word" data-w="${clean}">${w}</span>`; }).join(''); card.innerHTML=`<div class="meta"><span>📍 ${res.meta.area}</span><span>${res.meta.level}</span><span style="background:#00d4ff;color:#000">⭐ ${res.meta.xp} XP</span></div><h2 style="font-size:20px;margin:10px 0">${res.meta.topic}</h2><div class="reading">${words}</div><div class="chat-box"><input id="userInput" placeholder="Escribe tu frase..."><button id="sendBtn">Enviar</button></div><div id="feedback"></div>`; card.classList.remove('hidden'); document.getElementById('empty').classList.add('hidden'); pushToPage2(res, res.meta.vocab[0]||'evo'); card.scrollIntoView({behavior:'smooth'}); }
document.getElementById('gen').onclick=()=>{ if(!selected){ const k=Object.keys(LAYA_FINAL.AREAS); if(k.length>0) selected=k[0]; } const lvl=document.getElementById('level').value; const res=LAYA_FINAL.generate(selected, lvl, metrics); renderLesson(res); };
document.getElementById('gen2').onclick=()=>{ const w=document.getElementById('wordInput').value.trim(); if(!w) return; const c2=document.getElementById('card2'); c2.classList.remove('hidden'); c2.innerHTML=`<b style="color:#00d4ff">🔍 EVOLUCIÓN: ${w}</b>`; };
document.getElementById('teachBtn').onclick=()=>{document.getElementById('hWrapper').scrollTo({left:window.innerWidth, behavior:'smooth'});};
document.addEventListener('click', (e)=>{ if(e.target.classList.contains('word')){ document.getElementById('wordInput').value=e.target.dataset.w; document.getElementById('hWrapper').scrollTo({left:window.innerWidth, behavior:'smooth'}); setTimeout(()=>document.getElementById('gen2').click(), 400); }});
laiaActor.goTo('welcome');
</script>
</body>
</html>
