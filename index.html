<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LENGUAJE-PRO V22.0 REAL - 0.11 WAIST</title>
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#00d4ff">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}</script>
<style>
.h-wrapper{margin-top:58px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;height:calc(100vh - 58px);position:relative;z-index:10}
.h-wrapper::-webkit-scrollbar{display:none}
.page{min-width:100vw;width:100vw;height:100%;scroll-snap-align:start;overflow-y:auto;display:flex;flex-direction:row;position:relative;z-index:10}
#page1 aside{width:330px;min-width:330px;background:rgba(26,26,35,0.28)!important;backdrop-filter:blur(2px);border:1px solid rgba(0,212,255,0.15);padding:14px;position:sticky;top:0;height:calc(100vh - 58px);overflow-y:auto;z-index:11;pointer-events:auto}
#page1 main{flex:1;padding:18px;max-width:860px;background:rgba(15,15,20,0.18)!important;z-index:11;pointer-events:auto}
#page2{background:rgba(18,18,26,0.18);padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;min-width:100vw;z-index:11;pointer-events:auto}
.sap-header,.sap-card,.evo-lab,#card{background:rgba(26,26,35,0.28)!important;backdrop-filter:blur(4px)!important;border:1px solid rgba(0,212,255,0.25)!important;z-index:12!important}
button, input, select, .area, .f, .word{pointer-events:auto!important;z-index:15!important}
.area{background:rgba(35,35,50,0.45)!important;border:1px solid rgba(0,212,255,0.15)!important}
#laia-hologram{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;z-index:5!important;display:flex!important;align-items:center!important;justify-content:center!important;pointer-events:none!important;opacity:1!important;mix-blend-mode:normal!important;filter:none!important}
#laia-holo-canvas{width:100vw!important;height:100vh!important;background:transparent!important;pointer-events:none!important}
#laia-state{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,0.9);color:#000;font-size:9px;padding:3px 10px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<header style="z-index:100"><div class="logo">📚 LENGUAJE-PRO <span>V22.0 REAL 0.11 WAIST</span></div><div class="metrics"><span id="xp">⭐ 0 XP</span><span>🔥 <b id="streak">0</b></span><span id="level-badge">A2</span></div></header>
<div class="h-wrapper" id="hWrapper"><div class="page" id="page1"><aside><h3 style="font-size:11px;color:#00d4ff">V22.0 REAL - 7000 PTS - 0.11 WAIST</h3><input id="search" placeholder="Buscar..."><div id="filters"><button class="f active" data-f="">Todas</button><button class="f" data-f="A1">A1</button><button class="f" data-f="A2">A2</button><button class="f" data-f="B1">B1</button><button class="f" data-f="B2">B2</button></div><div id="list"></div></aside><main><div style="display:flex;gap:10px;margin-bottom:12px"><select id="level"><option>A1</option><option selected>A2</option><option>B1</option><option>B2</option></select><button id="gen" style="background:#00d4ff;color:#000;border:none;padding:10px 16px;border-radius:10px;font-weight:700;flex:1;max-width:260px">⚡ GENERAR V22.0</button><button id="teachBtn" style="background:#8b5cf6;color:#fff;border:none;padding:10px 12px;border-radius:10px;font-weight:700">📌 SAPs</button></div><div id="empty"><h1>👋 Soy Laia V22.0 FINAL</h1><p id="status" style="color:#00d4ff">Cargando REAL 0.11 UNIFIED...</p></div><div id="card" class="hidden"></div></main></div><div class="page" id="page2"><div style="width:100%;max-width:760px"><h2>🧬 MOTOR 2 - SAP + CONSTELLATION</h2><div class="sap-header" id="sapHeader">Esperando datos...</div><div style="margin-top:14px;display:flex;gap:8px"><input id="wordInput" placeholder="Escribe: co, hav, mon..." style="flex:1;background:#1a1a23;border:1px solid #2a2a3a;color:#fff;padding:10px;border-radius:10px"><button id="gen2" style="background:#00d4ff;color:#000;border:none;padding:10px 16px;border-radius:10px;font-weight:700">🔍 EXPLORAR</button></div><div id="card2" class="hidden" style="margin-top:14px;background:#1a1a23;border-radius:16px;padding:18px"></div><div class="evo-lab" id="evoLab">CONSTELLATION 7000 LAB - V22.0 REAL 0.11 WAIST</div></div></div></div>
<div id="laia-hologram"><canvas id="laia-holo-canvas"></canvas><div id="laia-state">V22.0 UNIFIED 7000PTS - 0.11 WAIST</div></div>
<script type="module">
import { LAYA_FINAL } from './LAYA_FINAL_COMPLETO.js';
import { thinkAndMove } from './actor/laia_actor_brain.js';
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

class LaiaMeshOnly {
  constructor(canvas){
    this.canvas=canvas; this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
    this.camera.position.set(0, 0.10, 1.75);
    this.renderer=new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.8));
    this.bones=[]; this.group=new THREE.Group();
    this.group.scale.set(0.78, 0.78, 0.78);
    this.group.position.set(0.10, -0.10, 0);
    if(window.innerWidth<768){ this.camera.position.set(0, 0.08, 2.0); this.group.scale.set(0.72,0.72,0.72); }
    this.createInvisibleSkeleton(); this.createFullBodyPointCloudREAL();
    this.scene.add(this.group); this.clock=new THREE.Clock();
    window.addEventListener('resize',()=>{this.camera.aspect=window.innerWidth/window.innerHeight; this.camera.updateProjectionMatrix(); this.renderer.setSize(window.innerWidth, window.innerHeight);});
    this.animate();
  }
  createInvisibleSkeleton(){const mk=(p,par)=>{const b=new THREE.Bone(); b.position.copy(p); par.add(b); this.bones.push(b); return b;}; const hips=mk(new THREE.Vector3(0,0,0),this.group); const s1=mk(new THREE.Vector3(0,0.18,0),hips); const s2=mk(new THREE.Vector3(0,0.22,0),s1); const ch=mk(new THREE.Vector3(0,0.22,0),s2); mk(new THREE.Vector3(0,0.18,0),ch); mk(new THREE.Vector3(0,0.14,0),ch); while(this.bones.length<34) mk(new THREE.Vector3(0,0,0),hips);}

  createFullBodyPointCloudREAL(){
    // PERFIL REAL COMO TU FOTO 3 - ANCHO, NO AGUJA
    const profile = [
      new THREE.Vector2(0.055, -0.60),
      new THREE.Vector2(0.070, -0.48),
      new THREE.Vector2(0.088, -0.25),
      new THREE.Vector2(0.108, -0.05),
      new THREE.Vector2(0.185, 0.05),  // cadera 0.37
      new THREE.Vector2(0.110, 0.24),  // cintura 0.11 REAL
      new THREE.Vector2(0.160, 0.38),  // pecho
      new THREE.Vector2(0.178, 0.50),  // hombros
      new THREE.Vector2(0.075, 0.58)
    ];
    const bodyLathe = new THREE.LatheGeometry(profile, 36);
    
    const headGeo = new THREE.SphereGeometry(0.135, 20, 20);
    headGeo.translate(0, 0.74, 0.02);
    
    const eyeGeo = new THREE.SphereGeometry(0.014, 8, 8);
    const eyeL = eyeGeo.clone(); eyeL.translate(-0.04, 0.76, 0.095);
    const eyeR = eyeGeo.clone(); eyeR.translate(0.04, 0.76, 0.095);
    const mouthGeo = new THREE.SphereGeometry(0.011, 6, 6); mouthGeo.translate(0, 0.705, 0.10);

    const armGeo = new THREE.CapsuleGeometry(0.045, 0.50, 8, 16);
    const armL = armGeo.clone(); armL.rotateZ(Math.PI/2); armL.translate(-0.42, 0.44, 0);
    const armR = armGeo.clone(); armR.rotateZ(Math.PI/2); armR.translate(0.42, 0.44, 0);

    const legGeo = new THREE.CapsuleGeometry(0.065, 0.52, 8, 16);
    const legL = legGeo.clone(); legL.translate(-0.105, -0.26, 0);
    const legR = legGeo.clone(); legR.translate(0.105, -0.26, 0);

    const allGeos = mergeGeometries([bodyLathe, headGeo, eyeL, eyeR, mouthGeo, armL, armR, legL, legR]);

    // MUESTREO UNIFICADO POR AREA - 7000 pts
    const posAttr = allGeos.attributes.position;
    const idx = allGeos.index;
    const triCount = idx.count / 3;
    const areas = [];
    let totalArea = 0;
    for(let i=0;i<triCount;i++){
      const a = idx.getX(i*3), b = idx.getX(i*3+1), c = idx.getX(i*3+2);
      const ax=posAttr.getX(a), ay=posAttr.getY(a), az=posAttr.getZ(a);
      const bx=posAttr.getX(b), by=posAttr.getY(b), bz=posAttr.getZ(b);
      const cx=posAttr.getX(c), cy=posAttr.getY(c), cz=posAttr.getZ(c);
      const abx=bx-ax, aby=by-ay, abz=bz-az;
      const acx=cx-ax, acy=cy-ay, acz=cz-az;
      const crossX=aby*acz-abz*acy, crossY=abz*acx-abx*acz, crossZ=abx*acy-aby*acx;
      const area=Math.sqrt(crossX*crossX+crossY*crossY+crossZ*crossZ)*0.5;
      areas.push(area); totalArea+=area;
    }

    const points=[]; const hairPoints=[];
    for(let n=0;n<7000;n++){
      let r=Math.random()*totalArea; let tri=0;
      for(let i=0;i<areas.length;i++){ r-=areas[i]; if(r<=0){tri=i; break;}}
      const a=idx.getX(tri*3), b=idx.getX(tri*3+1), c=idx.getX(tri*3+2);
      const ax=posAttr.getX(a), ay=posAttr.getY(a), az=posAttr.getZ(a);
      const bx=posAttr.getX(b), by=posAttr.getY(b), bz=posAttr.getZ(b);
      const cx=posAttr.getX(c), cy=posAttr.getY(c), cz=posAttr.getZ(c);
      const r1=Math.random(), r2=Math.random(); const sr=Math.sqrt(r1);
      const u=1-sr, v=sr*(1-r2), w=sr*r2;
      points.push(ax*u+bx*v+cx*w, ay*u+by*v+cy*w, az*u+bz*v+cz*w);
    }

    // PELO
    const bobGeo=new THREE.SphereGeometry(0.138, 16, 16, 0, Math.PI*2, 0, Math.PI*0.70);
    bobGeo.translate(0, 0.74, -0.01);
    const bp=bobGeo.attributes.position; const bi=bobGeo.index;
    for(let i=0;i<700;i++){
      const tri=Math.floor(Math.random()*(bi.count/3));
      const a=bi.getX(tri*3), b=bi.getX(tri*3+1), c=bi.getX(tri*3+2);
      const ax=bp.getX(a), ay=bp.getY(a), az=bp.getZ(a);
      const bx=bp.getX(b), by=bp.getY(b), bz=bp.getZ(b);
      const cx=bp.getX(c), cy=bp.getY(c), cz=bp.getZ(c);
      const r1=Math.random(), r2=Math.random(); const sr=Math.sqrt(r1);
      const u=1-sr, v=sr*(1-r2), w=sr*r2;
      hairPoints.push(ax*u+bx*v+cx*w, ay*u+by*v+cy*w, az*u+bz*v+cz*w);
    }

    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(points,3));
    this.bones[3].add(new THREE.Points(geo,new THREE.PointsMaterial({color:0x00d4ff, size:0.0135, transparent:true, opacity:0.96, sizeAttenuation:true})));
    const hgeo=new THREE.BufferGeometry(); hgeo.setAttribute('position',new THREE.Float32BufferAttribute(hairPoints,3));
    this.bones[3].add(new THREE.Points(hgeo,new THREE.PointsMaterial({color:0xc9a88a, size:0.011, transparent:true, opacity:0.90})));

    // LINEAS
    const lpos=[];
    for(let i=0;i<points.length;i+=18){ for(let j=i+18;j<Math.min(points.length,i+144);j+=18){ const dx=points[i]-points[j], dy=points[i+1]-points[j+1], dz=points[i+2]-points[j+2]; if(dx*dx+dy*dy+dz*dz<0.008){ lpos.push(points[i],points[i+1],points[i+2], points[j],points[j+1],points[j+2]); } } }
    const lgeo=new THREE.BufferGeometry(); lgeo.setAttribute('position',new THREE.Float32BufferAttribute(lpos,3));
    this.bones[3].add(new THREE.LineSegments(lgeo,new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:0.20})));
  }
  async goTo(z){const m={welcome:{x:0.10,y:-0.10}, reading_text:{x:-0.10,y:-0.08}, input_field:{x:0.25,y:-0.08}}; if(m[z]){this.group.position.x=m[z].x; this.group.position.y=m[z].y;} document.getElementById('laia-state').textContent=z.toUpperCase()+' • V22.0 UNIFIED 0.11';}
  animate(){requestAnimationFrame(()=>this.animate()); const t=this.clock.getElapsedTime(); thinkAndMove(this.bones, {reading:true, talkAmp:0.3+Math.sin(t*4)*0.2}); this.renderer.render(this.scene, this.camera);}
}
let metrics=JSON.parse(localStorage.getItem('LAYA_METRICS_V9')||'{"level":"A2","xp_total":50,"streak_days":8}');
let selected=null, currentFilter='';
const laiaActor=new LaiaMeshOnly(document.getElementById('laia-holo-canvas'));
const listEl=document.getElementById('list');
function renderList(f='', lvl=''){ if(!LAYA_FINAL||!LAYA_FINAL.AREAS){listEl.innerHTML='Error'; return;} listEl.innerHTML=''; let first=null; Object.entries(LAYA_FINAL.AREAS).forEach(([id,a])=>{ const hay=`${id} ${a.name} ${a.topic} ${a.level}`.toLowerCase(); if(f&&!hay.includes(f)) return; if(lvl&&a.level!==lvl) return; if(!first) first=id; const d=document.createElement('div'); d.className='area'; d.innerHTML=`<b>${id}. ${a.name}</b><small>${a.topic} • ${a.level}</small>`; d.onclick=()=>{selected=id; document.querySelectorAll('.area').forEach(x=>x.classList.remove('active')); d.classList.add('active'); laiaActor.goTo('reading_text');}; listEl.appendChild(d); }); if(!selected&&first) selected=first; document.getElementById('status').textContent=`V22.0 UNIFIED: ${Object.keys(LAYA_FINAL.AREAS).length} áreas`; }
renderList();
document.getElementById('search').oninput=e=>renderList(e.target.value.toLowerCase(), currentFilter);
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentFilter=b.dataset.f; renderList(document.getElementById('search').value.toLowerCase(), currentFilter);});
document.getElementById('level').value=metrics.level; document.getElementById('streak').textContent=metrics.streak_days; document.getElementById('xp').textContent=`⭐ ${metrics.xp_total} XP`; document.getElementById('level-badge').textContent=metrics.level;
function pushToPage2(res, w){ document.getElementById('sapHeader').innerHTML=`<b style="color:#00d4ff">V22.0 UNIFIED // ${res.meta.grammar_main.sig} // ${w}</b><div style="margin-top:8px;font-size:12px">📍 ${res.meta.area} | ${res.meta.topic}</div>`; }
function renderLesson(res){ const card=document.getElementById('card'); const words=res.story.split(/(\s+)/).map(w=>{ const clean=w.toLowerCase().replace(/[^a-z]/g,''); if(!clean||w.trim().length<2) return w; return `<span class="word" data-w="${clean}">${w}</span>`; }).join(''); card.innerHTML=`<div class="meta"><span>📍 ${res.meta.area}</span><span>${res.meta.level}</span><span style="background:#00d4ff;color:#000">⭐ ${res.meta.xp} XP</span></div><h2 style="font-size:20px;margin:10px 0">${res.meta.topic}</h2><div class="reading">${words}</div><div class="chat-box"><input id="userInput" placeholder="Escribe tu frase..."><button id="sendBtn">Enviar</button></div><div id="feedback"></div>`; card.classList.remove('hidden'); document.getElementById('empty').classList.add('hidden'); pushToPage2(res, res.meta.vocab[0]||'evo'); card.scrollIntoView({behavior:'smooth'}); }
document.getElementById('gen').onclick=()=>{ if(!selected){ const k=Object.keys(LAYA_FINAL.AREAS); if(k.length>0) selected=k[0]; } const lvl=document.getElementById('level').value; const res=LAYA_FINAL.generate(selected, lvl, metrics); renderLesson(res); };
document.getElementById('gen2').onclick=()=>{ const w=document.getElementById('wordInput').value.trim(); if(!w) return; const c2=document.getElementById('card2'); c2.classList.remove('hidden'); c2.innerHTML=`<b style="color:#00d4ff">🔍 EVOLUCIÓN: ${w}</b>`; };
document.getElementById('teachBtn').onclick=()=>{document.getElementById('hWrapper').scrollTo({left:window.innerWidth, behavior:'smooth'});};
document.addEventListener('click', (e)=>{ if(e.target.classList.contains('word')){ document.getElementById('wordInput').value=e.target.dataset.w; document.getElementById('hWrapper').scrollTo({left:window.innerWidth, behavior:'smooth'}); setTimeout(()=>document.getElementById('gen2').click(), 400); }});
laiaActor.goTo('welcome');
</script>
</body>
</html>
